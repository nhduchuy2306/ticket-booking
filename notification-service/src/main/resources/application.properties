server.port=9005
spring.application.name=notification-service

# Mail Configuration
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your@email.com
spring.mail.password=yourpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:9761/eureka/

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus

# Polling intervals (milliseconds)
notification.polling.new-event-interval-ms=300000
notification.polling.tomorrow-reminder-interval-ms=3600000
