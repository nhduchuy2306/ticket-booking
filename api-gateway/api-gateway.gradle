// =============================================
// api-gateway - API Gateway Service
// =============================================

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Cloud Gateway
    implementation "org.springframework.cloud:spring-cloud-starter-gateway:${gatewayVersion}"

    // Eureka Client
    implementation "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:${eurekaClientVersion}"

    // Actuator & Monitoring
    implementation "org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}"
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Documentation (WebFlux-based for Gateway)
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocWebfluxVersion}"

    // Local dependency - with exclusions since Gateway is WebFlux-based
    implementation(project(':common-service')) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-oauth2-resource-server'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-jpa'
    }

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}
