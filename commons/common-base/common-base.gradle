plugins {
    id 'java-library'
}

dependencies {
    // Spring Boot Starters
    api "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    api "org.springframework.boot:spring-boot-starter-aop:${springBootVersion}"
    api "org.springframework.boot:spring-boot-starter-validation:${springBootVersion}"

    // Spring Security Core (for SecurityContextHolder, Authentication in AbstractController)
    api "org.springframework.security:spring-security-core:${springSecurityCoreVersion}"

    // Spring Cloud OpenFeign
    api "org.springframework.cloud:spring-cloud-starter-openfeign:${openfeignVersion}"

    // Jackson
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    api "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    api "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"

    // Apache Commons
    api "org.apache.commons:commons-lang3:${commonsLangVersion}"
    api "org.apache.commons:commons-collections4:${commonsCollectionsVersion}"

    // Documentation
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocWebmvcVersion}"
}
